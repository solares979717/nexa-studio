name: Rename homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename nexa-studio-website.html to index.html
        run: |
          if [ -f nexa-studio-website.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git mv nexa-studio-website.html index.html
            git commit -m "Update homepage — clear 4 categories, less text"
            git push
          else
            echo "No file to rename"
          fi
